<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACGN小测试 · 科高樱花社</title>
    <link rel="stylesheet" href="../static/sakura.css">
    <script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>
</head>
<body>
    <div class="sakura-bg" id="sakura-bg"></div>
    <a href="../" class="back-home">← 返回主页</a>

    <div class="container">
        <div class="quiz-card">
            <div class="user-bar" id="user-bar"></div>

            <h1>ACGN 小测试</h1>

            <div class="rank-tabs" style="margin-bottom: 20px;">
                <button class="rank-tab active" data-difficulty="easy" onclick="switchDifficulty('easy')">简单模式</button>
                <button class="rank-tab" data-difficulty="hard" onclick="switchDifficulty('hard')">困难模式</button>
            </div>

            <p style="text-align:center;color:var(--text-sub);margin-bottom:24px;">选择一个玩法开始挑战吧</p>

            <div class="mode-grid">
                <a href="play.html?mode=normal&difficulty=easy" id="mode-normal" class="mode-card">
                    <div class="icon-seal" style="margin: 0 auto 12px;">普</div>
                    <h3>普通模式</h3>
                    <p>随机抽取 15 题<br>可返回上一题修改答案</p>
                </a>
                <a href="play.html?mode=endless&difficulty=easy" id="mode-endless" class="mode-card">
                    <div class="icon-seal" style="margin: 0 auto 12px;">无</div>
                    <h3>无尽模式</h3>
                    <p>全部题目打乱<br>答错 10 题后结束挑战</p>
                </a>
            </div>

            <h2 style="text-align:center;color:var(--text-main);font-size:1.3rem;margin-bottom:16px;">排行榜</h2>

            <div class="rank-tabs">
                <button class="rank-tab active" data-rank-diff="easy" onclick="switchRankDiff('easy')">简单</button>
                <button class="rank-tab" data-rank-diff="hard" onclick="switchRankDiff('hard')">困难</button>
            </div>
            <div class="rank-tabs">
                <button class="rank-tab active" data-rank-mode="normal" onclick="switchRankMode('normal')">普通模式</button>
                <button class="rank-tab" data-rank-mode="endless" onclick="switchRankMode('endless')">无尽模式</button>
            </div>

            <div id="rank-list" class="rank-list">
                <p class="rank-empty">正在加载排行榜...</p>
            </div>
        </div>
    </div>

    <footer>
        © 2026 深圳科学高中樱花社 · 由 HongAX 开发
    </footer>

    <script src="../static/appwrite-client.js"></script>
    <script>
        let currentDifficulty = 'easy';   
        let rankDifficulty = 'easy';      
        let rankMode = 'normal';          
        let currentUser = null;

        async function checkUser() {
            try {
                currentUser = await account.get();
                // 获取准确的 GitHub 头像
                try {
                    const identities = await account.listIdentities();
                    const gh = identities.identities.find(id => id.provider === 'github');
                    if (gh) {
                        currentUser.avatarUrl = `https://avatars.githubusercontent.com/u/${gh.providerUid}?v=4`;
                    } else {
                        currentUser.avatarUrl = `https://github.com/${currentUser.name}.png`;
                    }
                } catch (e) {
                    currentUser.avatarUrl = `https://github.com/${currentUser.name}.png`;
                }
            } catch (e) {
                currentUser = null;
            }
            renderUserBar();
        }

        function renderUserBar() {
            const bar = document.getElementById('user-bar');
            if (currentUser) {
                const name = currentUser.name || 'User';
                const avatar = currentUser.avatarUrl;
                bar.innerHTML = `
                    <img src="${avatar}" alt="${name}">
                    <span class="user-name">${name}</span>
                    <button class="btn-logout-sm" onclick="signOut()">退出</button>
                `;
            } else {
                bar.innerHTML = `
                    <span style="color:var(--text-sub);font-size:0.85rem;">未登录</span>
                    <button class="btn-login-sm" onclick="signInWithGitHub()">使用 GitHub 登录</button>
                `;
            }
        }

        async function signInWithGitHub() {
            const redirectUrl = window.location.origin + window.location.pathname;
            await account.createOAuth2Session('github', redirectUrl, redirectUrl);
        }

        async function signOut() {
            await account.deleteSession('current');
            currentUser = null;
            renderUserBar();
        }

        function switchDifficulty(diff) {
            currentDifficulty = diff;
            document.querySelectorAll('[data-difficulty]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.difficulty === diff);
            });
            document.getElementById('mode-normal').href = `play.html?mode=normal&difficulty=${diff}`;
            document.getElementById('mode-endless').href = `play.html?mode=endless&difficulty=${diff}`;
        }

        function switchRankDiff(diff) {
            rankDifficulty = diff;
            document.querySelectorAll('[data-rank-diff]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.rankDiff === diff);
            });
            loadRank(rankMode, rankDifficulty);
        }

        function switchRankMode(mode) {
            rankMode = mode;
            document.querySelectorAll('[data-rank-mode]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.rankMode === mode);
            });
            loadRank(rankMode, rankDifficulty);
        }

        async function loadRank(mode, difficulty) {
            const listEl = document.getElementById('rank-list');
            listEl.innerHTML = '<p class="rank-empty">正在加载...</p>';

            try {
                let data = [];
                const queries = [
                    Query.equal('mode', mode),
                    Query.equal('difficulty', difficulty),
                    Query.orderDesc('score'),
                    Query.orderAsc('time_seconds'),
                    Query.limit(50)
                ];

                if (window.isNewTables) {
                    const response = await db.listRows({
                        databaseId: DATABASE_ID,
                        tableId: TABLE_ID,
                        queries: queries
                    });
                    data = response.rows;
                } else {
                    const response = await db.listDocuments(DATABASE_ID, TABLE_ID, queries);
                    data = response.documents;
                }

                if (data.length === 0) {
                    listEl.innerHTML = '<p class="rank-empty">还没有成绩，快来抢第一吧！</p>';
                    return;
                }

                listEl.innerHTML = data.map((item, i) => {
                    const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
                    let rankNum = i < 3 ? `0${i + 1}` : (i + 1).toString();
                    
                    return `<div class="rank-item">
                        <span class="rank-no ${rankClass}">${rankNum}</span>
                        <img class="rank-avatar" src="${item.avatar_url || ''}" alt="">
                        <span class="rank-name">${item.username}</span>
                        <span class="rank-score">${item.score} 分</span>
                        <span class="rank-time">${formatTime(item.time_seconds)}</span>
                    </div>`;
                }).join('');
            } catch (error) {
                console.error('加载排行榜详细错误:', error);
                listEl.innerHTML = `<p class="rank-empty">排行榜加载失败: ${error.message}</p>`;
            }
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return m > 0 ? `${m}分${s}秒` : `${s}秒`;
        }

        async function init() {
            await checkUser();
            switchDifficulty(currentDifficulty);
            loadRank(rankMode, rankDifficulty);

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('userId') && currentUser) {
                const pending = localStorage.getItem('pending_score');
                if (pending) {
                    try {
                        const p = JSON.parse(pending);
                        await submitPendingScore(p);
                        localStorage.removeItem('pending_score');
                    } catch (e) {
                        console.error('提交暂存成绩失败：', e);
                    }
                    loadRank(rankMode, rankDifficulty);
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }
        }

        async function submitPendingScore(p) {
            if (!currentUser) return;
            
            try {
                let existingData = [];
                const queries = [
                    Query.equal('user_id', currentUser.$id),
                    Query.equal('mode', p.mode),
                    Query.equal('difficulty', p.difficulty)
                ];

                if (window.isNewTables) {
                    const existing = await db.listRows({ databaseId: DATABASE_ID, tableId: TABLE_ID, queries: queries });
                    existingData = existing.rows;
                } else {
                    const existing = await db.listDocuments(DATABASE_ID, TABLE_ID, queries);
                    existingData = existing.documents;
                }

                const isBetter = existingData.length === 0 || 
                                 p.score > existingData[0].score ||
                                 (p.score === existingData[0].score && p.time_seconds < existingData[0].time_seconds);

                if (isBetter) {
                    const avatarUrl = currentUser.avatarUrl;
                    const payload = {
                        user_id: currentUser.$id,
                        username: currentUser.name,
                        avatar_url: avatarUrl,
                        mode: p.mode,
                        difficulty: p.difficulty,
                        score: p.score,
                        time_seconds: p.time_seconds
                    };

                    if (existingData.length > 0) {
                        if (window.isNewTables) {
                            await db.updateRow({
                                databaseId: DATABASE_ID, tableId: TABLE_ID, rowId: existingData[0].$id,
                                data: { score: p.score, time_seconds: p.time_seconds, avatar_url: avatarUrl, username: currentUser.name }
                            });
                        } else {
                            await db.updateDocument(DATABASE_ID, TABLE_ID, existingData[0].$id, {
                                score: p.score, time_seconds: p.time_seconds, avatar_url: avatarUrl, username: currentUser.name
                            });
                        }
                    } else {
                        if (window.isNewTables) {
                            await db.createRow({
                                databaseId: DATABASE_ID, tableId: TABLE_ID, rowId: ID.unique(), data: payload
                            });
                        } else {
                            await db.createDocument(DATABASE_ID, TABLE_ID, ID.unique(), payload);
                        }
                    }
                }
            } catch (e) {
                console.error("提交失败：", e);
            }
        }

        init();

        const sakuraBg = document.getElementById('sakura-bg');
        for (let i = 0; i < 30; i++) {
            const s = document.createElement('div');
            s.classList.add('sakura');
            const size = Math.random() * 12 + 6;
            s.style.width = size + 'px';
            s.style.height = size + 'px';
            s.style.left = Math.random() * 100 + 'vw';
            s.style.animationDuration = (Math.random() * 5 + 8) + 's';
            s.style.animationDelay = Math.random() * 5 + 's';
            sakuraBg.appendChild(s);
        }
    </script>
    <script src="../static/music-player.js" data-src="../static/music/music.mp3"></script>
</body>
</html>

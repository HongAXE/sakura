<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACGN小测试 · 科高樱花社</title>
    <link rel="stylesheet" href="../static/sakura.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .mode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .mode-card {
            display: block;
            padding: 28px 24px;
            background: var(--card-bg);
            border-radius: 20px;
            text-decoration: none;
            color: var(--text-main);
            border: 2px solid transparent;
            transition: all 0.3s;
            text-align: center;
            box-shadow: 0 8px 20px rgba(224, 90, 109, 0.08);
        }
        .mode-card:hover {
            border-color: var(--sakura-pink);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(224, 90, 109, 0.18);
        }
        .mode-card .icon { font-size: 2.5rem; margin-bottom: 12px; }
        .mode-card h3 { color: var(--sakura-dark); font-size: 1.2rem; margin-bottom: 6px; }
        .mode-card p { color: var(--text-sub); font-size: 0.85rem; line-height: 1.5; }

        .rank-tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .rank-tab {
            padding: 8px 24px;
            border: 1px solid var(--sakura-pink);
            background: rgba(255, 255, 255, 0.6);
            color: var(--sakura-dark);
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .rank-tab.active {
            background: var(--sakura-dark);
            color: white;
        }
        .rank-list { display: flex; flex-direction: column; gap: 6px; }
        .rank-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            font-size: 0.9rem;
        }
        .rank-item .rank-no {
            width: 28px;
            font-weight: 700;
            color: var(--sakura-dark);
            text-align: center;
            flex-shrink: 0;
        }
        .rank-item .rank-avatar {
            width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
        }
        .rank-item .rank-name {
            flex: 1; font-weight: 600; color: #333;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .rank-item .rank-score {
            color: var(--sakura-dark); font-weight: 700; flex-shrink: 0;
        }
        .rank-item .rank-time {
            color: var(--text-sub); font-size: 0.8rem; flex-shrink: 0; min-width: 60px; text-align: right;
        }
        .rank-empty {
            text-align: center; color: #999; padding: 30px 0; font-size: 0.9rem;
        }
        .gold { color: #d4a017; }
        .silver { color: #a8a8a8; }
        .bronze { color: #b87433; }
    </style>
</head>
<body>
    <div class="sakura-bg" id="sakura-bg"></div>
    <a href="../" class="back-home">← 返回主页</a>

    <div class="container">
        <div class="quiz-card">
            <h1>🎯 科高樱花社 · ACGN 小测试</h1>
            <p style="text-align:center;color:#666;margin-bottom:24px;">选择一个模式开始挑战吧～</p>

            <div class="mode-grid">
                <a href="play.html?mode=normal" class="mode-card">
                    <div class="icon">📖</div>
                    <h3>普通模式</h3>
                    <p>随机抽取 15 题<br>可返回上一题修改答案</p>
                </a>
                <a href="play.html?mode=endless" class="mode-card">
                    <div class="icon">🔥</div>
                    <h3>无尽模式</h3>
                    <p>全部题目打乱<br>答错 10 题后结束挑战</p>
                </a>
            </div>

            <h2 style="text-align:center;color:var(--sakura-dark);font-size:1.3rem;margin-bottom:16px;">🏆 排行榜</h2>
            <div class="rank-tabs">
                <button class="rank-tab active" data-mode="normal" onclick="switchTab('normal')">普通模式</button>
                <button class="rank-tab" data-mode="endless" onclick="switchTab('endless')">无尽模式</button>
            </div>
            <div id="rank-list" class="rank-list">
                <p class="rank-empty">正在加载排行榜...</p>
            </div>
        </div>
    </div>

    <footer>
        © 2026 深圳科学高中樱花社 · 由 HongAX 开发
    </footer>

    <script src="../static/supabase-client.js"></script>
    <script>
        let currentMode = 'normal';

        async function loadRank(mode) {
            const listEl = document.getElementById('rank-list');
            listEl.innerHTML = '<p class="rank-empty">正在加载...</p>';

            const { data, error } = await supabaseClient
                .from('scores')
                .select('*')
                .eq('mode', mode)
                .order('score', { ascending: false })
                .order('time_seconds', { ascending: true })
                .limit(50);

            if (error) {
                listEl.innerHTML = '<p class="rank-empty">排行榜加载失败</p>';
                return;
            }
            if (!data || data.length === 0) {
                listEl.innerHTML = '<p class="rank-empty">还没有成绩，快来抢第一吧！</p>';
                return;
            }

            listEl.innerHTML = data.map((item, i) => {
                const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
                const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
                return `<div class="rank-item">
                    <span class="rank-no ${rankClass}">${medal}</span>
                    <img class="rank-avatar" src="${item.avatar_url || ''}" alt="">
                    <span class="rank-name">${item.username}</span>
                    <span class="rank-score">${item.score} 分</span>
                    <span class="rank-time">${formatTime(item.time_seconds)}</span>
                </div>`;
            }).join('');
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return m > 0 ? `${m}分${s}秒` : `${s}秒`;
        }

        function switchTab(mode) {
            currentMode = mode;
            document.querySelectorAll('.rank-tab').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            loadRank(mode);
        }

        // 初始化
        loadRank('normal');

        // ===== 登录状态变化时，尝试提交暂存的成绩 =====
        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if (session) {
                const pending = localStorage.getItem('pending_score');
                if (pending) {
                    try {
                        const p = JSON.parse(pending);
                        const user = session.user;

                        const { data: existing } = await supabaseClient
                            .from('scores')
                            .select('score, time_seconds')
                            .eq('user_id', user.id)
                            .eq('mode', p.mode)
                            .maybeSingle();

                        const isBetter = !existing ||
                            p.score > existing.score ||
                            (p.score === existing.score && p.time_seconds < existing.time_seconds);

                        if (isBetter) {
                            if (existing) {
                                await supabaseClient.from('scores')
                                    .update({
                                        score: p.score,
                                        time_seconds: p.time_seconds,
                                        updated_at: new Date()
                                    })
                                    .eq('user_id', user.id)
                                    .eq('mode', p.mode);
                            } else {
                                await supabaseClient.from('scores').insert({
                                    user_id: user.id,
                                    username: user.user_metadata.user_name,
                                    avatar_url: user.user_metadata.avatar_url,
                                    mode: p.mode,
                                    score: p.score,
                                    time_seconds: p.time_seconds
                                });
                            }
                        }
                        localStorage.removeItem('pending_score');
                        loadRank(currentMode);
                    } catch (e) {
                        console.error('提交暂存成绩失败：', e);
                    }
                } else {
                    loadRank(currentMode);
                }
            }
        });

        // 樱花飘落
        const sakuraBg = document.getElementById('sakura-bg');
        for (let i = 0; i < 30; i++) {
            const s = document.createElement('div');
            s.classList.add('sakura');
            const size = Math.random() * 12 + 6;
            s.style.width = size + 'px';
            s.style.height = size + 'px';
            s.style.left = Math.random() * 100 + 'vw';
            s.style.animationDuration = (Math.random() * 5 + 8) + 's';
            s.style.animationDelay = Math.random() * 5 + 's';
            sakuraBg.appendChild(s);
        }
    </script>
    <script src="../static/music-player.js" data-src="../static/music/music.mp3"></script>
</body>
</html>
